<html>
 <body>
<div style="color:green;font-size:51px;">
 <script language="JavaScript">
    var liczba1 = prompt("m, większa od 0 wynosi: ","");
    var m_blad = parseFloat(liczba1);

    document.write("m="+m_blad+"<br>");
    var m1, m2;
    m1=m_blad+1;
    m2=(m_blad+1)*m_blad;

 function okno_zamknij_blad(){window.close()}
    
    document.write("1/"+m_blad+"=1/"+m1+"+1/"+m2+"<br>");

 </script>
 </div>
 <input type="button" value="zamknij okno" onclick="okno_zamknij_blad()"/>
 </body>
 </html>
